<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Таблицы</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: solid black 1px;
        }
    </style>
</head>
<body>
<table>
    <tr>
        <th colspan="2">Заголовок на 2 столбца</th>
    </tr>
    <tr>
        <td rowspan="2">Ячейка на 2 строки</td>
        <td>Обычная ячейка</td>
    </tr>
    <tr>
        <td>Обычная ячейка</td>
    </tr>
</table>
</table>
</body>
</html>
